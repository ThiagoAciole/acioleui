name: Release acioleui

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/src/**'
      - 'packages/ui/package.json'
      - 'packages/ui/vite.config.ts'
      - 'packages/ui/scripts/**'
      - 'packages/ui/.agents/**'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: publish-acioleui
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check vulnerabilities
        run: npm audit --audit-level=high

      - name: Bump patch version
        run: npm version patch --workspace=packages/ui --no-git-tag-version

      - name: Build package
        run: npm run build --workspace=packages/ui

      - name: Publish to npm
        run: npm publish --workspace=packages/ui --access public

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push version bump
        run: |
          # The build regenerates this tracked source file before the release commit.
          git add packages/ui/package.json package-lock.json packages/ui/src/icons/generated.tsx
          git commit -m "chore: release acioleui [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
